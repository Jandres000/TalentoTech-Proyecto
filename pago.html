<!DOCTYPE html>
<html lang="es">
<head>
    <title>FanStore - Finalizar Compra</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="apple-touch-icon" href="img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">

    <!-- CSS de la tienda -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/templatemo.css">
    <link rel="stylesheet" href="css/custom.css">

    <!-- Fuentes y Iconos -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="css/fontawesome.min.css">

    <!-- Scripts de datos y funciones de la tienda -->
    <script src="db-simulacion/datos.js"></script>
    <script src="db-simulacion/funciones.js"></script>
</head>

<body>
    <!-- 1. Encabezado de la tienda -->
    <div id="header"></div>

    <!-- Contenido Principal de la Página de Pago -->
    <div class="container py-5">
        <div class="row">
            <div class="col-lg-12 text-center mb-4">
                <h1 class="h1">Finalizar Compra</h1>
                <p>Por favor, revisa tu pedido y completa los datos de pago.</p>
            </div>
        </div>

        <div class="row g-5">
            <!-- Columna Izquierda: Resumen del Pedido -->
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h2 class="h4 mb-0">Resumen de tu Pedido</h2>
                    </div>
                    <div class="card-body">
                        <!-- Aquí se listarán los productos del carrito -->
                        <ul class="list-group list-group-flush" id="resumen-carrito">
                            <!-- Los productos se insertarán aquí con JS -->
                        </ul>
                    </div>
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <strong class="h5">Total a Pagar:</strong>
                        <strong class="h5 text-success">$<span id="total-pago">0.00</span></strong>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Formulario de Pago -->
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h2 class="h4 mb-0">Datos de Pago</h2>
                    </div>
                    <div class="card-body">
                        <form id="payment-form" novalidate>
                            <div class="mb-3">
                                <label for="card-number" class="form-label">Número de Tarjeta</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa fa-credit-card"></i></span>
                                    <input type="text" class="form-control" id="card-number" placeholder="xxxx xxxx xxxx xxxx" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-7 mb-3">
                                    <label for="expiry-date" class="form-label">Expiración (MM/AA)</label>
                                    <input type="text" class="form-control" id="expiry-date" placeholder="MM/AA" required>
                                </div>
                                <div class="col-md-5 mb-3">
                                    <label for="cvc" class="form-label">CVC</label>
                                    <input type="text" class="form-control" id="cvc" placeholder="123" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="card-holder" class="form-label">Nombre del Titular</label>
                                <input type="text" class="form-control" id="card-holder" placeholder="Nombre completo" required>
                            </div>
                            <hr class="my-4">
                            <button type="submit" class="w-100 btn btn-success btn-lg">Pagar Ahora</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. Pie de página de la tienda -->
    <div id="footer"></div>

    <!-- Scripts de la plantilla -->
    <script src="js/jquery-1.11.0.min.js"></script>
    <script src="js/jquery-migrate-1.2.1.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/templatemo.js"></script>
    <script src="js/custom.js"></script>

    <!-- Script específico para la página de pago -->
    <script>
        // Función para mostrar el resumen del carrito en esta página
        function mostrarResumenPago() {
            const carrito = obtenerCarrito();
            const contenedorResumen = document.getElementById('resumen-carrito');
            const totalElement = document.getElementById('total-pago');
            let total = 0;

            contenedorResumen.innerHTML = ''; // Limpiar el contenedor

            if (carrito.length === 0) {
                contenedorResumen.innerHTML = '<li class="list-group-item">Tu carrito está vacío.</li>';
                document.querySelector('#payment-form button').disabled = true; // Deshabilitar botón si no hay nada que pagar
            } else {
                carrito.forEach(producto => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between lh-sm';
                    li.innerHTML = `
                        <div>
                            <h6 class="my-0">${producto.nombre}</h6>
                            <small class="text-muted">1 unidad</small>
                        </div>
                        <span class="text-muted">$${producto.precio.toFixed(2)}</span>
                    `;
                    contenedorResumen.appendChild(li);
                    total += producto.precio;
                });
            }

            totalElement.textContent = total.toFixed(2);
        }

        // Lógica para simular el pago
        const form = document.getElementById('payment-form');
        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Prevenir el envío real del formulario

            // Simulación de validación simple
            if (form.checkValidity() === false) {
                event.stopPropagation();
                form.classList.add('was-validated');
                return;
            }

            // Simulación de pago exitoso
            alert('¡Pago realizado con éxito! Gracias por tu compra.');
            
            // Vaciar el carrito
            vaciarCarrito();
            
            // Redirigir al usuario a la página de inicio después de 1 segundo
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        });

        // Carga de componentes y ejecución inicial
        document.addEventListener("DOMContentLoaded", () => {
            // Cargar header y footer
            cargarFragmento("header", "header.html").then(() => {
                actualizarContadorCarritoDisplay();
                actualizarContadorPaginasVistas();
            });
            cargarFragmento("footer", "footer.html").then(() => {
                cargarCategoriasFooter();
                setupSubscriptionForm();
            });

            // Mostrar el resumen del pedido al cargar la página
            mostrarResumenPago();
            
        });
    </script>

</body>
</html>

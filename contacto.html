<!DOCTYPE html>
<html lang="es">
<head>
    <title>FanStore</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="apple-touch-icon" href="img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/templatemo.css">
    <link rel="stylesheet" href="css/custom.css">

    <!-- Load fonts style after rendering the layout styles -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">
    <link rel="stylesheet" href="css/fontawesome.min.css">

    <script src="db-simulacion/datos.js"></script>
    <script src="db-simulacion/funciones.js"></script>
 
</head>
<body>

    <div id="header"></div>

      <!-- Start Content Page -->
    <div class="container-fluid bg-light py-5">
        <div class="col-md-6 m-auto text-center">
            <h1 class="h1">Contactanos</h1>
            <p>
             ¿Tienes alguna pregunta sobre nuestros productos, tu pedido o simplemente quieres compartir tu pasión por los videojuegos, el anime, las series o las películas? ¡Nos encantaría escucharte!

            </p>
        </div>
    </div>
<div class="container">
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3982.205103468195!2d-76.3133509239845!3d3.540089596434157!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e3a048cb47219db%3A0x648961599ce79421!2sCentro%20Comercial%20Unicentro%20Palmira!5e0!3m2!1ses-419!2sco!4v1750129315583!5m2!1ses-419!2sco" width="100%" height="300px" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
<!-- Start Contact -->
    <div class="container py-5">
        <div class="row py-5">
            <form class="col-md-9 m-auto" method="post" role="form">
                <div class="row">
                    <div class="form-group col-md-6 mb-3">
                        <label for="inputname">Nombre</label>
                        <input type="text" class="form-control mt-1" id="name" name="name" placeholder="Nombre"> 
                    </div>
                    <div class="form-group col-md-6 mb-3">
                        <label for="inputemail">Correo electronico</label>
                        <input type="email" class="form-control mt-1" id="email" name="email" placeholder="cliente@gmail.com">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="inputsubject">Asunto</label>
                    <input type="text" class="form-control mt-1" id="subject" name="subject" placeholder="Asunto">
                </div>
                <div class="mb-3">
                    <label for="inputmessage">Mensaje</label>
                    <textarea class="form-control mt-1" id="message" name="message" placeholder="Mensaje" rows="8"></textarea>
                </div>
                <div class="row">
                    <div class="col text-end mt-2">
                        <button type="submit" class="btn btn-success btn-lg px-3">¡Contactanos!</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <!-- End Contact -->


 <div id="footer"></div>

    <!-- Start Script -->
    <script src="js/jquery-1.11.0.min.js"></script>
    <script src="js/jquery-migrate-1.2.1.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/templatemo.js"></script>
    <script src="js/custom.js"></script>
    <!-- End Script -->

    <script>
         document.addEventListener("DOMContentLoaded", () => {
            
            // Llama a cargarFragmento para el header y encadena un .then()
            cargarFragmento("header", "header.html")
                .then(() => {
                    // Este código se ejecutará DESPUÉS de que el header se haya cargado.
                    // Ahora el elemento #contadorCarrito SÍ existe.
                    actualizarContadorCarritoDisplay();
                
                    actualizarContadorPaginasVistas();
            });

            // La carga del footer puede seguir como estaba, ya que no depende de nada.
              cargarFragmento("footer", "footer.html")
            .then(() => {
                // ¡AQUÍ ESTÁ EL NUEVO CÓDIGO!
                cargarCategoriasFooter();
                setupSubscriptionForm();
            });
                
        });
    </script>
    
</body>
</html>
